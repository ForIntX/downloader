name: Publish platform release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example 1.0.0-beta.3)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify and package Linux application
        shell: bash
        run: |
          test "$(cat VERSION)" = "${RELEASE_TAG}"
          package="Downloader-${RELEASE_TAG}-Linux"
          mkdir -p "$package"
          cp -R app.py video_indirici assets start.sh install.sh uninstall.sh VERSION LICENSE README.md README.tr.md SECURITY.md SECURITY.en.md "$package/"
          tar -czf "$package.tar.gz" "$package"
          deb_root="Downloader-${RELEASE_TAG}-Debian"
          mkdir -p "$deb_root/DEBIAN" "$deb_root/opt/downloader" "$deb_root/usr/bin" \
            "$deb_root/usr/share/applications" "$deb_root/usr/share/icons/hicolor/scalable/apps"
          cp -R app.py video_indirici assets VERSION LICENSE README.md README.tr.md "$deb_root/opt/downloader/"
          cp assets/com.forintx.VideoIndirici.desktop "$deb_root/usr/share/applications/com.forintx.VideoIndirici.desktop"
          sed -i 's|^Exec=downloader$|Exec=/usr/bin/downloader|' "$deb_root/usr/share/applications/com.forintx.VideoIndirici.desktop"
          cp assets/com.forintx.VideoIndirici.svg "$deb_root/usr/share/icons/hicolor/scalable/apps/com.forintx.VideoIndirici.svg"
          deb_version="${RELEASE_TAG/-beta./~beta.}"
          printf '%s\n' \
            'Package: downloader' \
            "Version: ${deb_version}" \
            'Section: video' \
            'Priority: optional' \
            'Architecture: all' \
            'Depends: python3, python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, yt-dlp, ffmpeg, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav' \
            'Maintainer: ForIntX' \
            'Homepage: https://muhammetburakakkas.com' \
            'Description: Video, playlist, and audio downloader' > "$deb_root/DEBIAN/control"
          printf '%s\n' '#!/bin/sh' 'exec python3 /opt/downloader/app.py "$@"' > "$deb_root/usr/bin/downloader"
          chmod 0755 "$deb_root/usr/bin/downloader"
          dpkg-deb --build --root-owner-group "$deb_root" "Downloader-${RELEASE_TAG}-Linux.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: downloader-linux-${{ env.RELEASE_TAG }}
          path: |
            Downloader-${{ env.RELEASE_TAG }}-Linux.tar.gz
            Downloader-${{ env.RELEASE_TAG }}-Linux.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/video_indirici_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Prepare Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_PROPERTIES"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties
      - name: Test and build signed APK and AAB
        run: |
          flutter pub get
          dart analyze lib test
          flutter test
          flutter build apk --release --target-platform android-arm64,android-x64
          flutter build appbundle --release --target-platform android-arm64,android-x64
      - name: Name Android packages
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "Downloader-${RELEASE_TAG}-Android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "Downloader-${RELEASE_TAG}-Android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: downloader-android-${{ env.RELEASE_TAG }}
          path: |
            clients/video_indirici_flutter/Downloader-${{ env.RELEASE_TAG }}-Android.apk
            clients/video_indirici_flutter/Downloader-${{ env.RELEASE_TAG }}-Android.aab
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/video_indirici_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Download Windows engine tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/tools | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/download/2026.01.29/yt-dlp.exe -OutFile windows/tools/yt-dlp.exe
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip windows/tools
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-expanded
          Copy-Item (Get-ChildItem ffmpeg-expanded -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName windows/tools/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg-expanded -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName windows/tools/ffprobe.exe
          Copy-Item assets/third_party_licenses.txt windows/tools/THIRD_PARTY_LICENSES.txt
          Copy-Item assets/third_party_licenses.en.txt windows/tools/THIRD_PARTY_LICENSES.en.txt
      - name: Test and build Windows application
        run: |
          flutter pub get
          dart analyze lib test
          flutter test
          flutter build windows --release
      - name: Create portable ZIP and installer
        shell: pwsh
        run: |
          Compress-Archive build/windows/x64/runner/Release/* "Downloader-${env:RELEASE_TAG}-Windows.zip"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/video_indirici.iss
      - uses: actions/upload-artifact@v4
        with:
          name: downloader-windows-${{ env.RELEASE_TAG }}
          path: |
            clients/video_indirici_flutter/Downloader-${{ env.RELEASE_TAG }}-Windows.zip
            clients/video_indirici_flutter/dist/*.exe
          if-no-files-found: error

  publish:
    needs: [linux, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat "docs/releases/${RELEASE_TAG}.en.md" "docs/releases/${RELEASE_TAG}.md" > release-notes.md
          mapfile -d '' release_assets < <(find release-assets -type f -print0)
          test "${#release_assets[@]}" -gt 0
          gh release create "${RELEASE_TAG}" "${release_assets[@]}" --verify-tag --prerelease --title "Downloader ${RELEASE_TAG}" --notes-file release-notes.md
