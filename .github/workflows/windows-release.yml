name: Windows paketleri

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/video_indirici_flutter

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Sürüm numarasını oku
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1
          $version = (($line.Line -replace '^version:\s*', '') -split '\+')[0]
          if (-not $version) { throw 'Sürüm numarası okunamadı' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Windows motor araçlarını indir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/tools | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/download/2026.01.29/yt-dlp.exe -OutFile windows/tools/yt-dlp.exe
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip windows/tools
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-expanded
          Copy-Item (Get-ChildItem ffmpeg-expanded -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName windows/tools/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg-expanded -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName windows/tools/ffprobe.exe
          Copy-Item assets/third_party_licenses.txt windows/tools/THIRD_PARTY_LICENSES.txt

      - name: Test ve derleme
        run: |
          flutter pub get
          flutter test
          flutter build windows --release

      - name: Taşınabilir ZIP
        shell: pwsh
        run: Compress-Archive build/windows/x64/runner/Release/* "Downloader-$env:APP_VERSION-Windows.zip"

      - name: Inno Setup kurucusu
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/video_indirici.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: downloader-windows-${{ env.APP_VERSION }}
          path: |
            clients/video_indirici_flutter/Downloader-${{ env.APP_VERSION }}-Windows.zip
            clients/video_indirici_flutter/dist/*.exe
          if-no-files-found: error
