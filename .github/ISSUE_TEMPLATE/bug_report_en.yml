name: Bug report (English)
description: Report a reproducible application bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Android
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 1.0.0-beta.2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that trigger the problem in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors and logs
      description: Remove personal data, cookies, and account information.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for existing reports of the same problem.
          required: true
        - label: The logs I shared contain no cookies or personal information.
          required: true
